---
# Dev-only: grid & PV sensor emulator.
# This app is excluded in production via exclude_dirs in appdaemon.yaml.
grid_pv_emulator:
  module: dev_tools.grid_pv_emulator
  class: GridPvEmulator
  log: grid_pv_emulator_log
  update_interval: 10
  status_log_seconds: 30
  pv_panels:
    - peak_wp: 3200
      phases: 1
      connected_to_phase: 1
    - peak_wp: 3600
      phases: 1
      connected_to_phase: 2
  base_load:
    l1: 300
    l2: 300
    l3: 300
  fuse_threshold: 25

# Dev-only: Wallbox Quasar charger emulator.
# Acts as a second Modbus client to the static mock so it responds to V2G's
# setpoint (unblocks phase detection, charge/discharge, SoC). Stripped from the
# production image with the rest of dev_tools (Dockerfile rm).
charger_emulator:
  module: dev_tools.charger_emulator
  class: ChargerEmulator
  log: charger_emulator_log
  charger_host: quasar-mock
  charger_port: 5020
  update_interval: 0.5

  # Multiplication factor of how much faster the SoC is updated than in real life.
  # This is used to speed up the emulator for testing. Normal = 1, fast is 30.
  soc_speedup: 1

  status_log_seconds: 10
  ramp_up_seconds: 15
  ramp_down_seconds: 2
  power_target_fraction: 0.92
  battery_capacity_kwh: 58
  hw_soc_floor_pct: 10
  hw_soc_ceiling_pct: 97
  hw_max_charge_power_w: 5600
  hw_max_discharge_power_w: 5600

# Dev-only: EVtec BiDiPro charger emulator (ECP4 / Modbus 2.0 map).
# Same idea as charger_emulator, against the static EVtec mock (evtec-mock:5020,
# host port 5021). Has its own HA control entities (input_select.emulator_evtec_*)
# so both emulators can run side by side. Connector 9 mirrors the lab charger.
charger_emulator_evtec:
  module: dev_tools.charger_emulator_evtec
  class: EVtecChargerEmulator
  log: charger_emulator_evtec_log
  charger_host: evtec-mock
  charger_port: 5020
  connector: 9
  update_interval: 0.5
  soc_speedup: 1
  status_log_seconds: 10
  ramp_up_seconds: 15
  ramp_down_seconds: 2
  power_target_fraction: 0.92
  battery_capacity_wh: 58000
  hw_soc_floor_pct: 10
  hw_soc_ceiling_pct: 97
  hw_max_charge_power_w: 10000
  hw_max_discharge_power_w: 10000
