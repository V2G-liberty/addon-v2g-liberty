# Docker keeps every container's stdout in a json-file log with no size limit
# by default. The two modbus-server mocks log every Modbus request, which
# grew to 20 GB each and filled the Docker VM's disk. Applies to new
# containers only: recreate them after changing this.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:

  addon-v2g-liberty:
    logging: *default-logging
    build:
      context: ../v2g-liberty
      dockerfile: Dockerfile.dev
    volumes:
      - ..:/workspaces:cached
      - ./config:/homeassistant
      - ../v2g-liberty/rootfs/root/homeassistant/www/v2g_liberty/v2g-liberty-cards:/homeassistant/www/v2g_liberty/v2g-liberty-cards
      - ../v2g-liberty/data:/data
      - ../v2g-liberty/logs:/config/logs
    command: ["/bin/bash", "-c", "/workspaces/v2g-liberty/script/init-config && sleep infinity"]
    healthcheck:
      test: ['CMD', '/workspaces/v2g-liberty/script/is-container-ready']
      interval: 3s
      timeout: 1s
      retries: 100

  homeassistant:
    logging: *default-logging
    image: homeassistant/home-assistant:2026.9.4
    restart: unless-stopped
    ports:
      - 8123:8123
    volumes:
      - ./config:/config
      - ../v2g-liberty/rootfs/root/homeassistant/www/v2g_liberty/v2g-liberty-cards:/config/www/v2g_liberty/v2g-liberty-cards
    depends_on:
      addon-v2g-liberty:
        condition: service_healthy

  v2g-liberty-cards:
    logging: *default-logging
    build:
      context: ../v2g-liberty-cards
      dockerfile: Dockerfile.dev
    volumes:
      - ..:/workspaces:cached
      - ../v2g-liberty/rootfs/root/homeassistant/www/v2g_liberty/v2g-liberty-cards:/workspaces/v2g-liberty-cards/dist
    command: sleep infinity

  quasar-mock:
    logging: *default-logging
    image: oitc/modbus-server:latest
    command: ["-f", "/srvr_conf.json"]
    volumes:
      - ../charger-mocks/configs/quasar_charging_33pct.json:/srvr_conf.json:ro
    ports:
      - "5020:5020"

  evtec-mock:
    logging: *default-logging
    image: oitc/modbus-server:latest
    command: ["-f", "/srvr_conf.json"]
    volumes:
      - ../charger-mocks/configs/evtec_bidipro_33pct.json:/srvr_conf.json:ro
    ports:
      - "5021:5020"
